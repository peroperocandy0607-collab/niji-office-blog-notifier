name: Reliable Coconala blog notifications

on:
  schedule:
    # Start away from GitHub's busiest top-of-hour period. Two staggered
    # schedules provide a replacement run if one scheduled event is delayed.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niji-office-blog-check
  # Every scheduled run continues checking for 75 minutes. A newer run safely
  # replaces the older run, so only one runner is active at a time.
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Monitor for new blogs and send push notifications
        shell: bash
        run: |
          set -euo pipefail

          # Scheduled runs cover 75 minutes in five-minute intervals. Manual
          # runs stay one-shot so they finish quickly during maintenance.
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            iterations=16
          else
            iterations=1
          fi

          for ((attempt=1; attempt<=iterations; attempt++)); do
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] check ${attempt}/${iterations}"
            response="$(curl --fail --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 3 \
              --connect-timeout 15 --max-time 60 \
              'https://niji-office-blog-list.hidemiya.chatgpt.site/api/push/check')"
            echo "$response"

            ok="$(jq -r '.ok // false' <<<"$response")"
            if [[ "$ok" != "true" ]]; then
              echo "Notification API did not return ok=true" >&2
              exit 1
            fi

            if (( attempt < iterations )); then
              sleep 300
            fi
          done
