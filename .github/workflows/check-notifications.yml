name: Check new Coconala blogs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niji-office-blog-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check for a new blog and send push notifications
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error --retry 3 \
            'https://niji-office-blog-list.hidemiya.chatgpt.site/api/push/check')"
          echo "$response"
          printf '%s' "$response" | grep -q '"ok":true'
